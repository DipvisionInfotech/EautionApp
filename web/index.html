<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Slick Salvage LLP - Premier E-auction Platform">
  
  <!-- Prevent browser, proxy, and CDN caching of index.html -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Slick Salvage LLP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Slick Salvage LLP - Premier E-auction Platform</title>
  <link rel="manifest" href="manifest.json">
  
  <script>
    (function () {
      // 1. Immediately wipe any legacy Service Workers & browser CacheStorage
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          var hadSw = registrations && registrations.length > 0;
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
          // If this client had a service worker controlling it, reload once to detach it completely
          if (hadSw && !sessionStorage.getItem('sw_cleared_reload')) {
            sessionStorage.setItem('sw_cleared_reload', '1');
            if ('caches' in window) {
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) { return caches.delete(name); }));
              }).finally(function () {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }).catch(function () {});
      }

      // 2. Automated Version Sentinel: Detects when a new build is uploaded to the server
      var bootstrapInjected = false;
      function injectBootstrap() {
        if (bootstrapInjected) return;
        bootstrapInjected = true;
        var s = document.createElement('script');
        s.src = "flutter_bootstrap.js?v=" + Date.now();
        s.async = true;
        document.body.appendChild(s);
      }

      // Fallback timer: Never hang or show blank screen if version.json is unreachable
      var fallbackTimer = setTimeout(injectBootstrap, 1200);

      fetch("version.json?t=" + Date.now(), {
        cache: "no-store",
        headers: { "Cache-Control": "no-cache, no-store", "Pragma": "no-cache" }
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        clearTimeout(fallbackTimer);
        if (data && (data.build_number || data.version)) {
          var latestBuild = (data.version || "1.0.0") + "." + (data.build_number || "");
          var activeBuild = localStorage.getItem("slick_app_active_build");

          // When a new build was deployed on Hostinger, automatically refresh to load it
          if (activeBuild && activeBuild !== latestBuild) {
            console.log("[AutoUpdate] New build detected: " + latestBuild + " (previous was: " + activeBuild + "). Auto-refreshing...");
            localStorage.setItem("slick_app_active_build", latestBuild);
            if ('caches' in window) {
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (n) { return caches.delete(n); }));
              }).finally(function () {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
            return;
          }
          localStorage.setItem("slick_app_active_build", latestBuild);
        }
        injectBootstrap();
      })
      .catch(function () {
        injectBootstrap();
      });
    })();
  </script>
</head>
<body>
</body>
</html>
