<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Slick Salvage LLP - Premier E-auction Platform">
  
  <!-- Prevent caching of index.html so updates are checked immediately -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Slick Salvage LLP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Slick Salvage LLP - Premier E-auction Platform</title>
  <link rel="manifest" href="manifest.json">
  
  <script>
    // Unregister any previously installed service workers and clear CacheStorage so old cached builds don't interfere
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
</head>
<body>
  <script>
    // Load flutter_bootstrap.js with cache-busting timestamp so new builds are detected immediately
    var bootstrapScript = document.createElement('script');
    bootstrapScript.src = "flutter_bootstrap.js?v=" + new Date().getTime();
    bootstrapScript.async = true;
    document.body.appendChild(bootstrapScript);
  </script>
</body>
</html>
